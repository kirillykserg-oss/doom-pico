name: Build Doom for Pico

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Download sources
        run: |
          mkdir -p $HOME/work && cd $HOME/work
          git clone --depth 1 https://github.com/kilograham/rp2040-doom.git
          (cd rp2040-doom && git submodule update --init --depth 1 || true)
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git \
            || git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git
          (cd pico-sdk && git submodule update --init --depth 1)
          git clone --depth 1 --branch sdk-2.2.0 https://github.com/raspberrypi/pico-extras.git \
            || git clone --depth 1 https://github.com/raspberrypi/pico-extras.git

      - name: Apply patches (screen, buttons, pins)
        run: |
          DEST=$HOME/work/rp2040-doom/src
          for f in src__*; do cp -v "$f" "$DEST/${f#src__}"; done
          for f in pico__*; do cp -v "$f" "$DEST/pico/${f#pico__}"; done

      - name: Build firmware
        run: |
          cd $HOME/work/rp2040-doom
          mkdir -p rp2040-build && cd rp2040-build
          cmake -DCMAKE_BUILD_TYPE=MinSizeRel -DPICO_BOARD=pico \
            -DPICO_SDK_PATH=$HOME/work/pico-sdk \
            -DPICO_EXTRAS_PATH=$HOME/work/pico-extras ..
          make -j4 doom_tiny

      - name: Make single DOOM.uf2 (firmware + levels)
        run: |
          cd $HOME/work/rp2040-doom/rp2040-build
          BIN=$(find . -name doom_tiny.bin | head -1)
          echo "Firmware: $BIN ($(stat -c%s "$BIN") bytes)"
          # беремо рівні (doom1.whx) з самого репозиторію Doom -- вони точно відповідають його коду
          UP=$(find $HOME/work/rp2040-doom -maxdepth 2 -name doom1.whx | head -1)
          echo "Upstream whx: $UP"
          if [ -n "$UP" ]; then WHX="$UP"; else WHX="$GITHUB_WORKSPACE/doom1.whx"; fi
          md5sum "$WHX" "$GITHUB_WORKSPACE/doom1.whx" || true
          python3 "$GITHUB_WORKSPACE/make_uf2.py" "$BIN" "$WHX" \
            "$GITHUB_WORKSPACE/DOOM.uf2" 0x10042000

      - uses: actions/upload-artifact@v4
        with:
          name: DOOM-uf2
          path: DOOM.uf2
